<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background / Glow Gradients -->
    <linearGradient id="capGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="capTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing Background Halo -->
  <circle cx="50" cy="50" r="44" fill="url(#capGlow)" opacity="0.15" filter="url(#neonBlur)" />
  <circle cx="50" cy="50" r="40" fill="#080c14" stroke="url(#capTopGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Lower Cap Skull/Base -->
  <path d="M28 54 C28 66, 72 66, 72 54 L72 60 C72 72, 28 72, 28 60 Z" 
        fill="url(#capTopGrad)" opacity="0.9"/>
  <path d="M30 55 C30 65, 70 65, 70 55 L70 59 C70 69, 30 69, 30 59 Z" 
        fill="url(#baseGrad)"/>

  <!-- Upper Mortarboard Diamond (Cap Top) -->
  <polygon points="50,22 86,38 50,54 14,38" 
           fill="url(#capTopGrad)" 
           filter="url(#neonBlur)"/>
  <polygon points="50,24 83,38 50,52 17,38" 
           fill="#0f172a"/>

  <!-- Inner Diamond Sheen / Tech Circuit Line -->
  <polygon points="50,28 75,38 50,48 25,38" 
           stroke="url(#capTopGrad)" stroke-width="1.2" fill="none" opacity="0.8"/>
  <circle cx="50" cy="38" r="2.5" fill="#38bdf8"/>

  <!-- Mortarboard Button / Apex Pin -->
  <circle cx="50" cy="38" r="3.5" fill="#ffffff" filter="url(#neonBlur)"/>
  <circle cx="50" cy="38" r="2" fill="#0284c7"/>

  <!-- Tassel Ribbon & Bob -->
  <path d="M50 38 Q68 40 76 52" 
        stroke="url(#tasselGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Tassel Bob & Fringe -->
  <circle cx="76" cy="53" r="2.5" fill="#fbbf24"/>
  <path d="M74 54 L73 68 M76 54 L76 70 M78 54 L79 68" 
        stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round"/>
</svg>
